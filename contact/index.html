<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luc Herlitz - Contact</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .header {
      background: linear-gradient(180deg, #87CEEB 0%, #E0F4FF 100%);
      padding: 40px 20px 30px;
      text-align: center;
    }
    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 16px;
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .title {
      font-size: 15px;
      color: #666;
      font-weight: 400;
    }
    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 20px 25px;
    }
    .quick-action-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
    }
    .quick-action-btn:hover {
      background: #f9f9f9;
    }
    .add-contact {
      background: #E3F2FD;
      margin: 0 20px 25px;
      padding: 14px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #1976D2;
      font-weight: 500;
      font-size: 15px;
    }
    .add-contact:hover {
      background: #BBDEFB;
    }
    .contact-list {
      padding: 0 20px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      text-decoration: none;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    .contact-item:hover {
      background: #f9f9f9;
    }
    .contact-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .contact-content {
      flex: 1;
      min-width: 0;
    }
    .contact-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .contact-value {
      font-size: 16px;
      color: #1a1a1a;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .location-section {
      padding: 25px 20px;
      margin-top: 15px;
      border-top: 1px solid #eee;
    }
    .location-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .location-address {
      font-size: 15px;
      color: #555;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .map-link {
      display: inline-block;
      color: #1976D2;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .map-link:hover {
      text-decoration: underline;
    }
    .org-section {
      padding: 0 20px 30px;
    }
    .org-btn {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f9f9f9;
      text-decoration: none;
      color: #1a1a1a;
    }
    .org-btn:hover {
      background: #f0f0f0;
    }
    .org-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .org-content {
      flex: 1;
    }
    .org-name {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .org-title {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="card">

      <a href="https://maps.google.com/?q=28000+Sportsman's+Drive,Rossford,OH+43460" target="_blank" class="quick-action-btn">📍</a>
    </div>

    <a href="luc-herlitz.vcf" download class="add-contact">

    <div class="contact-list">

          <div class="contact-value">(567) 229-2466</div>
        </div>
      </a>

      <a href="tel:+15673360945" class="contact-item">

      </a>

      <a href="mailto:lucas.herlitz@campingworld.com" class="contact-item">
        <div class="contact-icon">✉️</div>
        <div class="contact-content">
          <div class="contact-label">email</div>

      </a>

      <a href="https://campingworldoftoledo.com" target="_blank" class="contact-item">
        <div class="contact-icon">🌐</div>

    </div>

    <div class="location-section">
      <p class="location-label">Location</p>
      <p class="location-address">
        28000 Sportsman's Drive<br>

      </p>
      <a href="https://maps.google.com/?q=28000+Sportsman's+Drive,Rossford,OH+43460" target="_blank" class="map-link">Show on Map →</a>
    </div>

    <div class="org-section">
      <a href="https://campingworldoftoledo.com" target="_blank" class="org-btn">
        <div class="org-icon">🏢</div>
        <div class="org-content">
          <div class="org-name">Camping World of Toledo</div>
          <div class="org-title">Product Specialist</div>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
